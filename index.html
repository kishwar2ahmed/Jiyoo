<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <script>
      window.process = window.process || { env: { NODE_ENV: 'production' } };
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && (event.reason || event);
        var reasonStr = String((reason && reason.message) || reason || '');
        if (
          reasonStr.indexOf('WebSocket') !== -1 ||
          reasonStr.indexOf('websocket') !== -1 ||
          reasonStr.indexOf('Firestore') !== -1 ||
          reasonStr.indexOf('Failed to fetch') !== -1 ||
          reasonStr.indexOf('unavailable') !== -1
        ) {
          event.preventDefault();
          event.stopPropagation();
        }
      }, true);
      window.addEventListener('error', function(event) {
        var errStr = String((event && event.message) || '');
        if (errStr.indexOf('WebSocket') !== -1 || errStr.indexOf('websocket') !== -1) {
          event.preventDefault();
          event.stopPropagation();
        }
      }, true);
    </script>
    <link rel="icon" type="image/jpeg" href="/jiyoo.logo.jpeg" />
    <link rel="apple-touch-icon" href="/jiyoo.logo.jpeg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1C1917" />
    <title>JIYOO | Premium Products</title>
    
    <!-- SEO and Social Preview (Open Graph) -->
    <meta name="description" content="The world's finest ingredients, curated for the uncompromising palate. Delivered with precision and elegance." />
    <meta property="og:title" content="JIYOO | Premium Products" />
    <meta property="og:description" content="The world's finest ingredients, curated for the uncompromising palate. Delivered with precision and elegance." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-image.png" />
    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Store",
      "name": "JIYOO Premium Products",
      "description": "The world's finest ingredients, curated for the uncompromising palate."
    }
    </script>
    <!-- Preconnect to image CDNs -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="preconnect" href="https://upload.wikimedia.org" crossorigin />
    <!-- Preload critical brand, hero banner, and above-the-fold product assets -->
    <link rel="preload" as="image" href="/jiyoo.logo.jpeg" fetchpriority="high" />
    <link rel="preload" as="image" href="/banners/diwali_special_sale.webp" type="image/webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/assets/aistudio/velvet_butterfly_pill_final.webp" type="image/webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/assets/aistudio/velvet_whatsapp_pill_final.webp" type="image/webp" />
    <link rel="preload" as="image" href="/products/f_apple_royal_gala.jpg" fetchpriority="high" />
    <link rel="preload" as="image" href="/products/washington-apple.jfif" fetchpriority="high" />
    <link rel="preload" as="image" href="/products/f_apple_pink_lady.jpg" fetchpriority="high" />
    <link rel="preload" as="image" href="/products/apple-fuji.jfif" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
      /* Base body styles */
      body { 
        margin: 0; 
        background-color: #f8f6f0; 
        color: #1C1917;
        font-family: 'Plus Jakarta Sans', sans-serif;
      }
      .jiyoo-boot-loader {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: radial-gradient(ellipse at top, #FAF8F5, #F3EFE6, #E8E2D5);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        text-align: center;
        user-select: none;
      }
      .jiyoo-boot-logo-box {
        padding: 0.375rem;
        border-radius: 1rem;
        background: rgba(255, 255, 255, 0.75);
        border: 1px solid #E7E3DA;
        box-shadow: 0 20px 50px -12px rgba(28, 25, 23, 0.14);
        margin-bottom: 2rem;
      }
      .jiyoo-boot-logo-box img {
        height: 7rem;
        width: auto;
        border-radius: 0.75rem;
        display: block;
      }
      .jiyoo-boot-kicker {
        font-size: 10px;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        color: #78716C;
        font-weight: 500;
        margin-bottom: 0.5rem;
      }
      .jiyoo-boot-title {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 2rem;
        letter-spacing: 0.1em;
        color: #1C1917;
        font-weight: 600;
        margin: 0;
      }
      .jiyoo-boot-sub {
        font-size: 12px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #78716C;
        margin-top: 0.25rem;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="jiyoo-boot-loader" aria-hidden="true">
        <div class="jiyoo-boot-logo-box">
          <img src="/jiyoo.logo.jpeg" alt="JIYOO Logo" />
        </div>
        <div class="jiyoo-boot-kicker">Curated &amp; Handpicked</div>
        <h1 class="jiyoo-boot-title">JIYOO</h1>
        <p class="jiyoo-boot-sub">Fine Living &amp; Artisanal Pantry</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
